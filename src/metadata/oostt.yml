# PURL configuration for http://purl.obolibrary.org/obo/oostt

idspace: OOSTT
base_url: /obo/oostt

products:
- oostt.owl: https://raw.githubusercontent.com//noname/main/oostt.owl
- oostt.obo: https://raw.githubusercontent.com//noname/main/oostt.obo

term_browser: ontobee
example_terms:
- OOSTT_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com//noname/v

- prefix: /tracker/
  replacement: https://github.com//noname/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/OOSTT?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com//noname/main/

